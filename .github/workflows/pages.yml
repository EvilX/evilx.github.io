name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Два push подряд не должны публиковать сайт одновременно.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # На сайт — только файлы страницы, без README и служебных каталогов;
      # google*.html — подтверждение владения сайтом для Google Search Console.
      # Дата в sitemap.xml — день публикации.
      - name: Сборка сайта
        run: |
          mkdir _site
          cp -r index.html robots.txt img .nojekyll google*.html _site/
          sed "s|<lastmod>[^<]*</lastmod>|<lastmod>$(date -u +%F)</lastmod>|" sitemap.xml > _site/sitemap.xml

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Публикация — отдельной задачей: в той же задаче deploy-pages не находил
  # только что загруженный архив («No artifacts named github-pages»).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
